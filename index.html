<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MELÓMANO RADIO</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Be+Vietnam+Pro:wght@300;400;500;700&display=swap" rel="stylesheet">

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://extassisnetwork.com/player/Luna/luna.js"></script>

<style>

/* ───────────────── RESET ───────────────── */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

/* ───────────────── BODY ───────────────── */

body{

    min-height:100vh;

    background:
    radial-gradient(circle at top,#141414,#000);

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;

    font-family:'Be Vietnam Pro',sans-serif;

    padding:20px;

    position:relative;

}

/* ───────────────── PARTICULAS ───────────────── */

body::before{

    content:"";

    position:fixed;
    inset:0;

    background:

    radial-gradient(circle at 20% 20%,rgba(57,255,20,.12),transparent 18%),
    radial-gradient(circle at 80% 30%,rgba(255,0,128,.12),transparent 18%),
    radial-gradient(circle at 50% 80%,rgba(0,255,255,.12),transparent 18%);

    animation:bgmove 10s linear infinite alternate;

    filter:blur(40px);

}

/* ───────────────── MOVIL ───────────────── */

.player-phone{

    width:100%;
    max-width:390px;

    height:760px;

    border-radius:45px;

    position:relative;

    overflow:hidden;

    background:rgba(5,5,5,.84);

    backdrop-filter:blur(18px);

    border:2px solid rgba(255,255,255,.08);

    box-shadow:

    0 0 25px rgba(57,255,20,.35),
    0 0 55px rgba(255,0,128,.18),
    0 0 80px rgba(0,255,255,.15);

}

/* ───────────────── RGB BORDE ───────────────── */

.player-phone::before{

    content:"";

    position:absolute;

    inset:-2px;

    border-radius:45px;

    padding:2px;

    background:linear-gradient(
    45deg,
    #39ff14,
    #ffea00,
    #ff0080,
    #00ffff,
    #39ff14
    );

    background-size:400% 400%;

    animation:borderRgb 8s linear infinite;

    -webkit-mask:
    linear-gradient(#fff 0 0) content-box,
    linear-gradient(#fff 0 0);

    -webkit-mask-composite:xor;

    mask-composite:exclude;

}

/* ───────────────── TOP ───────────────── */

.top{

    width:100%;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:22px 22px 10px;

    color:#fff;

    position:relative;
    z-index:5;

}

.icon-btn{

    width:52px;
    height:52px;

    border-radius:50%;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:24px;

    color:#39ff14;

    border:2px solid rgba(57,255,20,.5);

    background:rgba(0,0,0,.35);

    box-shadow:
    0 0 15px rgba(57,255,20,.45);

}

/* ───────────────── LOGO ───────────────── */

.logo{

    text-align:center;

    margin-top:5px;

    position:relative;
    z-index:5;

}

.logo h1{

    font-family:'Orbitron',sans-serif;

    font-size:50px;

    line-height:.95;

    letter-spacing:1px;

    background:linear-gradient(
    90deg,
    #39ff14,
    #ffea00,
    #ff0080
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    text-shadow:
    0 0 15px rgba(57,255,20,.4);

}

.live{

    margin-top:12px;

    display:inline-flex;
    align-items:center;
    gap:8px;

    padding:7px 18px;

    border-radius:40px;

    background:rgba(57,255,20,.12);

    border:1px solid #39ff14;

    color:#39ff14;

    font-weight:700;

    box-shadow:
    0 0 15px rgba(57,255,20,.25);

}

/* ───────────────── ONDAS ───────────────── */

.wave-area{

    width:100%;

    height:90px;

    display:flex;
    justify-content:center;
    align-items:flex-end;

    gap:5px;

    margin-top:18px;

    position:relative;
    z-index:4;

}

.wave{

    width:6px;

    border-radius:30px;

    background:linear-gradient(
    to top,
    #ff0080,
    #ffea00,
    #39ff14,
    #00ffff
    );

    box-shadow:
    0 0 10px currentColor;

    animation:waveAnim 1s ease-in-out infinite;

}

.wave:nth-child(1){height:30px;animation-delay:.1s;}
.wave:nth-child(2){height:80px;animation-delay:.2s;}
.wave:nth-child(3){height:45px;animation-delay:.3s;}
.wave:nth-child(4){height:100px;animation-delay:.4s;}
.wave:nth-child(5){height:60px;animation-delay:.5s;}
.wave:nth-child(6){height:90px;animation-delay:.6s;}
.wave:nth-child(7){height:40px;animation-delay:.7s;}
.wave:nth-child(8){height:110px;animation-delay:.8s;}
.wave:nth-child(9){height:70px;animation-delay:.9s;}

/* ───────────────── COVER ───────────────── */

.cover-wrap{

    width:260px;
    height:260px;

    margin:15px auto 0;

    border-radius:50%;

    position:relative;

    display:flex;
    justify-content:center;
    align-items:center;

    z-index:5;

}

.cover-ring{

    position:absolute;
    inset:0;

    border-radius:50%;

    background:conic-gradient(
    #39ff14,
    #ffea00,
    #ff0080,
    #00ffff,
    #39ff14
    );

    animation:spin 6s linear infinite;

    filter:blur(1px);

}

.cover-ring::before{

    content:"";

    position:absolute;
    inset:10px;

    border-radius:50%;

    background:#000;

}

.cover{

    width:225px;
    height:225px;

    border-radius:50%;

    object-fit:cover;

    position:relative;
    z-index:3;

    box-shadow:
    0 0 20px rgba(57,255,20,.5);

    animation:beat 1.1s infinite;

}

/* ───────────────── INFO ───────────────── */

.song-box{

    width:88%;

    margin:22px auto 0;

    background:rgba(255,255,255,.03);

    border:1px solid rgba(57,255,20,.18);

    border-radius:22px;

    padding:18px;

    text-align:center;

    position:relative;
    z-index:5;

    box-shadow:
    0 0 25px rgba(57,255,20,.08);

}

.now{

    color:#39ff14;

    font-size:13px;

    letter-spacing:2px;

    margin-bottom:8px;

}

#artist{

    color:#fff;

    font-size:28px;

    font-weight:700;

}

#title{

    color:#ffea00;

    margin-top:6px;

    font-size:18px;

}

/* ───────────────── CONTROLES ───────────────── */

.controls{

    width:100%;

    display:flex;
    justify-content:center;
    align-items:center;

    gap:18px;

    margin-top:28px;

    position:relative;
    z-index:5;

}

.ctrl{

    width:72px;
    height:72px;

    border-radius:50%;

    background:rgba(255,255,255,.04);

    border:2px solid rgba(57,255,20,.4);

    display:flex;
    justify-content:center;
    align-items:center;

    color:#39ff14;

    font-size:28px;

    box-shadow:
    0 0 18px rgba(57,255,20,.25);

}

.play{

    width:95px;
    height:95px;

    background:#39ff14;

    color:#000;

    box-shadow:
    0 0 35px rgba(57,255,20,.55);

}

/* ───────────────── ECUALIZADOR ───────────────── */

.eq{

    width:88%;

    height:110px;

    margin:30px auto 0;

    display:flex;
    justify-content:center;
    align-items:flex-end;

    gap:7px;

    position:relative;
    z-index:5;

}

.eq span{

    width:12px;

    border-radius:20px;

    background:linear-gradient(
    to top,
    #ff0080,
    #ffea00,
    #39ff14
    );

    box-shadow:
    0 0 10px rgba(57,255,20,.35);

    animation:eqAnim 1s infinite ease-in-out;

}

.eq span:nth-child(1){height:40px;}
.eq span:nth-child(2){height:80px;}
.eq span:nth-child(3){height:55px;}
.eq span:nth-child(4){height:100px;}
.eq span:nth-child(5){height:65px;}
.eq span:nth-child(6){height:95px;}
.eq span:nth-child(7){height:50px;}
.eq span:nth-child(8){height:85px;}
.eq span:nth-child(9){height:60px;}

/* ───────────────── FOOTER ───────────────── */

.footer{

    position:absolute;

    bottom:16px;

    width:100%;

    text-align:center;

    color:#39ff14;

    font-size:11px;

    letter-spacing:1.5px;

    z-index:5;

    text-shadow:
    0 0 10px rgba(57,255,20,.7);

}

/* ───────────────── PLAYER REAL ───────────────── */

#extassisnetwork{

    position:absolute;

    inset:0;

    opacity:0;

    pointer-events:none;

}

/* ───────────────── ANIMACIONES ───────────────── */

@keyframes spin{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}

@keyframes beat{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.05);
    }

    100%{
        transform:scale(1);
    }

}

@keyframes waveAnim{

    0%{
        transform:scaleY(.5);
    }

    50%{
        transform:scaleY(1.3);
    }

    100%{
        transform:scaleY(.5);
    }

}

@keyframes eqAnim{

    0%{
        transform:scaleY(.5);
    }

    50%{
        transform:scaleY(1.3);
    }

    100%{
        transform:scaleY(.5);
    }

}

@keyframes bgmove{

    from{
        transform:translateY(0px);
    }

    to{
        transform:translateY(-20px);
    }

}

@keyframes borderRgb{

    0%{
        background-position:0% 50%;
    }

    50%{
        background-position:100% 50%;
    }

    100%{
        background-position:0% 50%;
    }

}

/* ───────────────── RESPONSIVE ───────────────── */

@media(max-width:480px){

    .player-phone{

        height:92vh;

        border-radius:38px;

    }

    .logo h1{

        font-size:40px;

    }

    .cover-wrap{

        width:220px;
        height:220px;

    }

    .cover{

        width:190px;
        height:190px;

    }

    #artist{

        font-size:22px;

    }

}

</style>

</head>

<body>

<div class="player-phone">

    <!-- TOP -->
    <div class="top">

        <div class="icon-btn">☰</div>

        <div class="icon-btn">⌁</div>

    </div>

    <!-- LOGO -->
    <div class="logo">

        <h1>MELÓMANO<br>RADIO</h1>

        <div class="live">

            ● EN VIVO

        </div>

    </div>

    <!-- ONDAS -->
    <div class="wave-area">

        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>

    </div>

    <!-- COVER -->
    <div class="cover-wrap">

        <div class="cover-ring"></div>

        <img class="cover"
        src="https://raw.githubusercontent.com/conectadosturadio/MELOMANOFOTOPERFIL/main/Gemini_Generated_Image_i56heri56heri56h.png">

    </div>

    <!-- INFO -->
    <div class="song-box">

        <div class="now">

            SONANDO AHORA

        </div>

        <div id="artist">

            MELÓMANO RADIO

        </div>

        <div id="title">

            Música Variada 24/7

        </div>

    </div>

    <!-- CONTROLES -->
    <div class="controls">

        <div class="ctrl">⏮</div>

        <div class="ctrl play" id="playButton">▶</div>

        <div class="ctrl">⏭</div>

    </div>

    <!-- ECUALIZADOR -->
    <div class="eq">

        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>

    </div>

    <!-- FOOT -->
    <div class="footer">

        Created By @virtualgraphic.pa

    </div>

    <!-- PLAYER REAL -->
    <div id="extassisnetwork"></div>

</div>

<script>

/* ───────────────── PLAYER ───────────────── */

$("#extassisnetwork").lunaradio({

    streamurl: "https://stream.zeno.fm/g0gymeeh6tsuv",

    radioname: "MELÓMANO RADIO",

    coverimage: "https://raw.githubusercontent.com/conectadosturadio/MELOMANOFOTOPERFIL/main/Gemini_Generated_Image_i56heri56heri56h.png",

    onlycoverimage: false,

    userinterface: "small",

    backgroundcolor: "transparent",

    fontcolor: "#ffffff",

    hightlightcolor: "#39ff14",

    fontname: "Be Vietnam",

    googlefont: "Be Vietnam",

    fontratio: "0.4",

    scroll: "true",

    coverstyle: "animated",

    usevisualizer: "real",

    visualizertype: "6",

    streamtype: "shoutcast2",

    shoutcastpath: "/stream",

    shoutcastid: "1",

    metadatainterval: "5000",

    volume: "100",

    usestreamcorsproxy: "true",

    autoplay:"true"

});

/* ───────────────── AUTOPLAY ───────────────── */

function autoPlayRadio(){

    const btn = document.querySelector(".fa-play");

    if(btn){

        btn.click();

    }

}

setInterval(autoPlayRadio,2500);

/* ───────────────── BOTON VISUAL ───────────────── */

document.getElementById("playButton")
.onclick=function(){

    autoPlayRadio();

};

/* ───────────────── METADATA ───────────────── */

async function loadMetadata(){

    try{

        const response = await fetch(
        "https://corsproxy.io/?https://stream.zeno.fm/api/nowplaying/g0gymeeh6tsuv"
        );

        const data = await response.json();

        if(data.title){

            let parts = data.title.split("-");

            if(parts.length >=2){

                document.getElementById("artist")
                .innerHTML=parts[0];

                document.getElementById("title")
                .innerHTML=parts.slice(1).join("-");

            }else{

                document.getElementById("artist")
                .innerHTML=data.title;

            }

        }

    }catch(e){

        console.log("metadata error");

    }

}

loadMetadata();

setInterval(loadMetadata,10000);

</script>

</body>
</html>
