<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melómano Radio - Reproductor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam:wght@300;400;600&display=swap" rel="stylesheet">
    
    <script src="https://code.jquery.com/jquery-3.2.1.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            padding: 20px;
            background: transparent !important;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Be Vietnam', sans-serif;
        }

        /* CONTENEDOR PRINCIPAL */
        #extassisnetwork-wrap {
            width: 92%;
            max-width: 330px;
            aspect-ratio: 360/480;
            position: relative;
            overflow: hidden;
            border-radius: 26px;
            background: rgba(5, 5, 5, 0.78);
            border: 2px solid transparent;
            animation: neonBorder 6s linear infinite;
            box-shadow: 
                0 0 18px rgba(57, 255, 20, .45),
                0 0 45px rgba(255, 0, 128, .18),
                0 0 70px rgba(0, 255, 255, .12);
        }

        /* EFECTO BORDE BRILLANTE GIRATORIO */
        .neon-glow {
            position: absolute;
            inset: -20px;
            z-index: -1;
            border-radius: 30px;
            background: linear-gradient(
                45deg,
                #39ff14,
                #ffea00,
                #ff0080,
                #00ffff,
                #39ff14
            );
            filter: blur(60px);
            opacity: .35;
            animation: rotateGlow 12s linear infinite;
        }

        /* DONDE VA EL REPRODUCTOR */
        #extassisnetwork {
            width: 100% !important;
            height: 100% !important;
            overflow: hidden;
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 25px 15px;
            color: #fff;
        }

        /* IMAGEN DE PORTADA */
        .cover-container {
            width: 85%;
            aspect-ratio: 1/1;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid rgba(57, 255, 20, 0.3);
            box-shadow: 0 0 20px rgba(57, 255, 20, 0.2);
            margin-top: 20px;
            position: relative;
        }

        .cover-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .cover-container:hover .cover-image {
            transform: scale(1.05);
        }

        /* NOMBRE DE LA EMISORA */
        .radio-name {
            color: #39ff14;
            font-size: 22px;
            font-weight: 600;
            text-shadow: 0 0 8px rgba(57, 255, 20, .95);
            letter-spacing: 1px;
            margin-top: 15px;
            text-align: center;
        }

        /* VISUALIZADOR DE BARRAS */
        .visualizer {
            width: 90%;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: end;
            gap: 4px;
            margin: 15px 0;
        }

        .bar {
            width: 5px;
            background: linear-gradient(to top, #39ff14, #00ffff);
            border-radius: 3px;
            box-shadow: 0 0 5px #39ff14;
            transition: height 0.1s ease;
        }

        /* BOTONES Y CONTROLES */
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 100%;
            margin-bottom: 20px;
        }

        .btn-play {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: rgba(0,0,0,0.5);
            border: 2px solid #39ff14;
            color: #39ff14;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.5);
            transition: all 0.2s ease;
        }

        .btn-play:hover {
            transform: scale(1.1);
            box-shadow: 0 0 25px rgba(57, 255, 20, 0.8);
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 60%;
        }

        .volume-icon {
            color: #ffea00;
            font-size: 18px;
        }

        .volume-slider {
            flex-grow: 1;
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 234, 0, 0.2);
            outline: none;
            -webkit-appearance: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #ffea00;
            cursor: pointer;
            box-shadow: 0 0 8px #ffea00;
        }

        /* CREDITOS */
        .vg-credit {
            position: absolute;
            bottom: 6px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 7px;
            letter-spacing: 1px;
            color: #39ff14;
            text-shadow: 0 0 8px rgba(57,255,20,.95);
            z-index: 999;
            pointer-events: none;
            opacity: .85;
        }

        /* ANIMACIONES */
        @keyframes neonBorder {
            0% {
                border-color: #39ff14;
                box-shadow: 
                    0 0 18px #39ff14,
                    0 0 45px rgba(57,255,20,.35);
            }
            25% {
                border-color: #ffea00;
                box-shadow: 
                    0 0 18px #ffea00,
                    0 0 45px rgba(255,234,0,.35);
            }
            50% {
                border-color: #ff0080;
                box-shadow: 
                    0 0 18px #ff0080,
                    0 0 45px rgba(255,0,128,.35);
            }
            75% {
                border-color: #00ffff;
                box-shadow: 
                    0 0 18px #00ffff,
                    0 0 45px rgba(0,255,255,.35);
            }
            100% {
                border-color: #39ff14;
                box-shadow: 
                    0 0 18px #39ff14,
                    0 0 45px rgba(57,255,20,.35);
            }
        }

        @keyframes rotateGlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* RESPONSIVE */
        @media(max-width:480px){
            body{
                padding:16px;
            }
            #extassisnetwork-wrap{
                width:88%;
                max-width:320px;
            }
        }
    </style>
</head>
<body>

    <div id="extassisnetwork-wrap">
        <div class="neon-glow"></div>
        
        <div id="extassisnetwork">
            <!-- Nombre de la radio -->
            <h2 class="radio-name">MELÓMANO RADIO</h2>

            <!-- Imagen de portada -->
            <div class="cover-container">
                <img class="cover-image" src="https://raw.githubusercontent.com/conectadosturadio/MELOMANOFOTOPERFIL/main/Gemini_Generated_Image_i56heri56heri56h.png" alt="Portada">
            </div>

            <!-- Visualizador -->
            <div class="visualizer" id="visualizer">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>

            <!-- Controles -->
            <div class="controls">
                <button class="btn-play" id="playBtn">
                    <i class="fa fa-play" id="playIcon"></i>
                </button>
                <div class="volume-container">
                    <span class="volume-icon"><i class="fa fa-volume-up"></i></span>
                    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="100">
                </div>
            </div>

            <!-- Audio Oculto -->
            <audio id="audioPlayer" preload="none">
                <source src="https://stream.zeno.fm/g0gymeeh6tsuv" type="audio/mpeg">
            

        </div>

        <div class="vg-credit">Created By: @virtualgraphic.pa</div>
    </div>

    <!-- CARGAMOS FONT AWESOME PARA LOS ICONOS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        $(document).ready(function() {
            const audio = document.getElementById('audioPlayer');
            const playBtn = $('#playBtn');
            const playIcon = $('#playIcon');
            const volumeSlider = $('#volumeSlider');
            const bars = document.querySelectorAll('.bar');
            let isPlaying = false;
            let audioContext, analyser, dataArray;

            // --- REPRODUCCIÓN AUTOMÁTICA INTELIGENTE ---
            function startRadio() {
                try {
                    if (!isPlaying) {
                        audio.autoplay = true;
                        audio.muted = true; // Empezamos silenciado por reglas del navegador
                        audio.volume = 1;
                        
                        let promise = audio.play();
                        if (promise !== undefined) {
                            promise.then(() => {
                                playIcon.removeClass('fa-play').addClass('fa-pause');
                                isPlaying = true;
                                // Subir volumen después de 1.2 segundos
                                setTimeout(() => { 
                                    audio.muted = false; 
                                    initVisualizer(); // Encender visualizador
                                }, 1200);
                            }).catch(() => {});
                        }
                    }
                } catch(e) {}
            }

            // Intentos múltiples al cargar
            window.addEventListener("load", () => {
                setTimeout(startRadio, 1000);
                setTimeout(startRadio, 2500);
                setTimeout(startRadio, 4000);
                setTimeout(startRadio, 6500);
            });

            // Activadores por interacción
            document.addEventListener("click", startRadio);
            document.addEventListener("touchstart", startRadio);
            document.addEventListener("mousemove", startRadio);
            document.addEventListener("scroll", startRadio);
            document.addEventListener("keydown", startRadio);

            // --- BOTÓN PLAY/PAUSE ---
            playBtn.click(function() {
                if (isPlaying) {
                    audio.pause();
                    playIcon.removeClass('fa-pause').addClass('fa-play');
                } else {
                    audio.play();
                    playIcon.removeClass('fa-play').addClass('fa-pause');
                    if(!audioContext) initVisualizer();
                }
                isPlaying = !isPlaying;
            });

            // --- CONTROL DE VOLUMEN ---
            volumeSlider.on('input', function() {
                audio.volume = $(this).val() / 100;
            });

            // --- VISUALIZADOR DE AUDIO ---
            function initVisualizer() {
                try {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    analyser = audioContext.createAnalyser();
                    const source = audioContext.createMediaElementSource(audio);
                    source.connect(analyser);
                    analyser.connect(audioContext.destination);
                    
                    analyser.fftSize = 32;
                    const bufferLength = analyser.frequencyBinCount;
                    dataArray = new Uint8Array(bufferLength);

                    animateVisualizer();
                } catch (e) { console.log("Error visualizador", e); }
            }

            function animateVisualizer() {
                requestAnimationFrame(animateVisualizer);
                if(!analyser) return;

                analyser.getByteFrequencyData(dataArray);
                
                for (let i = 0; i < bars.length; i++) {
                    // Escalamos el valor para que se vea bien visualmente
                    let height = (dataArray[i] / 255) * 100; 
                    // Mínimo valor para que no desaparezcan totalmente
                    height = height < 10 ? 10 : height; 
                    bars[i].style.height = height + '%';
                }
            }
        });
    </script>

</body>
</html>
