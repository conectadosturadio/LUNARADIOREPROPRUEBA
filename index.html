<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MELÓMANO RADIO</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Be+Vietnam+Pro:wght@300;400;600&display=swap" rel="stylesheet">

<script src="https://code.jquery.com/jquery-3.2.1.min.js"></script>
<script src="https://extassisnetwork.com/player/Luna/luna.js"></script>

<style>

/* ───────────────── RESET ───────────────── */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

/* ───────────────── BODY ───────────────── */

body{

    background:#020202;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;

    font-family:'Be Vietnam Pro',sans-serif;

    position:relative;

}

/* ───────────────── FONDO NEON ───────────────── */

body::before{

    content:"";

    position:fixed;
    inset:0;

    background:

    radial-gradient(circle at 20% 20%, rgba(57,255,20,.15), transparent 25%),
    radial-gradient(circle at 80% 20%, rgba(255,0,128,.15), transparent 25%),
    radial-gradient(circle at 50% 80%, rgba(0,255,255,.15), transparent 25%);

    filter:blur(60px);

    animation:moveBg 12s linear infinite alternate;

}

/* ───────────────── MOVIL ───────────────── */

.phone-player{

    width:360px;
    height:760px;

    border-radius:45px;

    position:relative;

    overflow:hidden;

    background:rgba(5,5,5,.88);

    border:2px solid rgba(255,255,255,.1);

    backdrop-filter:blur(20px);

    box-shadow:

    0 0 15px #39ff14,
    0 0 40px rgba(255,0,128,.4),
    0 0 80px rgba(0,255,255,.25);

    animation:borderGlow 5s linear infinite;

}

/* ───────────────── BORDE RGB ───────────────── */

.phone-player::before{

    content:"";

    position:absolute;
    inset:-3px;

    border-radius:45px;

    background:linear-gradient(
    45deg,
    #39ff14,
    #ffea00,
    #ff0080,
    #00ffff,
    #39ff14
    );

    z-index:-1;

    animation:rotateBorder 6s linear infinite;

    filter:blur(8px);

}

/* ───────────────── TOP BAR ───────────────── */

.top-bar{

    width:100%;
    padding:20px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    color:#fff;

}

.top-btn{

    width:52px;
    height:52px;

    border-radius:50%;

    border:2px solid #39ff14;

    display:flex;
    justify-content:center;
    align-items:center;

    color:#39ff14;

    font-size:24px;

    box-shadow:
    0 0 10px #39ff14;

    animation:pulseBtn 2s infinite;

}

/* ───────────────── TITULO ───────────────── */

.logo{

    text-align:center;

    margin-top:10px;

}

.logo h1{

    font-family:'Orbitron',sans-serif;

    font-size:52px;

    line-height:1;

    background:linear-gradient(
    90deg,
    #39ff14,
    #ffea00,
    #ff0080
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    text-shadow:
    0 0 20px rgba(57,255,20,.5);

}

.live{

    margin-top:12px;

    display:inline-block;

    padding:8px 20px;

    border-radius:50px;

    background:#39ff14;

    color:#000;

    font-weight:700;

    box-shadow:
    0 0 20px #39ff14;

}

/* ───────────────── VISUALIZADOR ───────────────── */

.visualizer{

    width:100%;
    height:120px;

    margin-top:20px;

    display:flex;
    justify-content:center;
    align-items:flex-end;
    gap:6px;

}

.bar{

    width:8px;

    border-radius:20px;

    background:linear-gradient(
    to top,
    #ff0080,
    #ffea00,
    #39ff14,
    #00ffff
    );

    animation:bars 1s infinite ease-in-out;

}

.bar:nth-child(odd){

    animation-duration:.8s;

}

.bar:nth-child(even){

    animation-duration:1.4s;

}

/* ───────────────── PORTADA ───────────────── */

.cover-wrap{

    width:260px;
    height:260px;

    margin:0 auto;

    border-radius:50%;

    position:relative;

    margin-top:10px;

    display:flex;
    justify-content:center;
    align-items:center;

    background:linear-gradient(
    45deg,
    #39ff14,
    #ff0080,
    #00ffff
    );

    animation:spinGlow 8s linear infinite;

}

.cover-wrap::before{

    content:"";

    position:absolute;
    inset:10px;

    background:#000;

    border-radius:50%;

}

.cover{

    width:220px;
    height:220px;

    border-radius:50%;

    object-fit:cover;

    position:relative;

    z-index:2;

    animation:musicBeat 1s infinite;

}

/* ───────────────── TITULOS ───────────────── */

.song-info{

    margin-top:20px;

    text-align:center;

    padding:0 20px;

}

.song-info h2{

    color:#fff;

    font-size:28px;

    margin-bottom:6px;

}

.song-info p{

    color:#39ff14;

    font-size:18px;

}

/* ───────────────── PLAYER REAL ───────────────── */

#extassisnetwork{

    width:100%;
    height:0;
    opacity:0;
    overflow:hidden;

}

/* ───────────────── CONTROLES ───────────────── */

.controls{

    margin-top:25px;

    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;

}

.ctrl{

    width:70px;
    height:70px;

    border-radius:50%;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:30px;

    color:#fff;

    border:2px solid #39ff14;

    box-shadow:
    0 0 15px #39ff14;

    cursor:pointer;

    transition:.3s;

}

.play{

    width:95px;
    height:95px;

    background:#39ff14;

    color:#000;

    box-shadow:
    0 0 25px #39ff14;

}

/* ───────────────── ECUALIZADOR ───────────────── */

.eq{

    width:85%;
    height:120px;

    margin:35px auto 0;

    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:8px;

}

.eq span{

    width:14px;

    border-radius:10px;

    background:linear-gradient(
    to top,
    #ff0080,
    #ffea00,
    #39ff14
    );

    animation:eq 1s infinite ease-in-out;

}

/* ───────────────── FOOTER ───────────────── */

.footer{

    position:absolute;

    bottom:18px;

    width:100%;

    text-align:center;

    color:#39ff14;

    font-size:12px;

    letter-spacing:2px;

    text-shadow:
    0 0 10px #39ff14;

}

/* ───────────────── ANIMACIONES ───────────────── */

@keyframes bars{

    0%{height:20px;}
    50%{height:100px;}
    100%{height:20px;}

}

@keyframes eq{

    0%{height:20px;}
    50%{height:90px;}
    100%{height:20px;}

}

@keyframes spinGlow{

    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}

}

@keyframes musicBeat{

    0%{transform:scale(1);}
    50%{transform:scale(1.06);}
    100%{transform:scale(1);}

}

@keyframes pulseBtn{

    0%{box-shadow:0 0 10px #39ff14;}
    50%{box-shadow:0 0 25px #39ff14;}
    100%{box-shadow:0 0 10px #39ff14;}

}

@keyframes borderGlow{

    0%{
        box-shadow:
        0 0 15px #39ff14,
        0 0 40px rgba(255,0,128,.4);
    }

    50%{
        box-shadow:
        0 0 20px #00ffff,
        0 0 60px rgba(255,234,0,.4);
    }

    100%{
        box-shadow:
        0 0 15px #39ff14,
        0 0 40px rgba(255,0,128,.4);
    }

}

@keyframes rotateBorder{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}

@keyframes moveBg{

    from{
        transform:scale(1);
    }

    to{
        transform:scale(1.2);
    }

}

/* ───────────────── RESPONSIVE ───────────────── */

@media(max-width:480px){

    .phone-player{

        width:92vw;
        height:88vh;

    }

    .logo h1{

        font-size:42px;

    }

}

</style>

</head>

<body>

<div class="phone-player">

    <!-- TOP -->
    <div class="top-bar">

        <div class="top-btn">☰</div>

        <div class="top-btn">⇪</div>

    </div>

    <!-- LOGO -->
    <div class="logo">

        <h1>MELÓMANO<br>RADIO</h1>

        <div class="live">● EN VIVO</div>

    </div>

    <!-- VISUAL -->
    <div class="visualizer">

        <div class="bar" style="height:50px"></div>
        <div class="bar" style="height:90px"></div>
        <div class="bar" style="height:35px"></div>
        <div class="bar" style="height:120px"></div>
        <div class="bar" style="height:65px"></div>
        <div class="bar" style="height:100px"></div>
        <div class="bar" style="height:50px"></div>
        <div class="bar" style="height:80px"></div>

    </div>

    <!-- PORTADA -->
    <div class="cover-wrap">

        <img class="cover"
        src="https://raw.githubusercontent.com/conectadosturadio/MELOMANOFOTOPERFIL/main/Gemini_Generated_Image_i56heri56heri56h.png">

    </div>

    <!-- INFO -->
    <div class="song-info">

        <h2 id="artist-name">Cargando...</h2>

        <p id="song-title">MELÓMANO RADIO</p>

    </div>

    <!-- CONTROLES -->
    <div class="controls">

        <div class="ctrl">⏮</div>

        <div class="ctrl play" id="playBtn">▶</div>

        <div class="ctrl">⏭</div>

    </div>

    <!-- ECUALIZADOR -->
    <div class="eq">

        <span style="height:60px"></span>
        <span style="height:100px"></span>
        <span style="height:45px"></span>
        <span style="height:90px"></span>
        <span style="height:65px"></span>
        <span style="height:110px"></span>
        <span style="height:55px"></span>
        <span style="height:80px"></span>

    </div>

    <!-- PLAYER REAL -->
    <div id="extassisnetwork"></div>

    <!-- FOOTER -->
    <div class="footer">

        Created By @virtualgraphic.pa

    </div>

</div>

<script>

/* ───────────────── PLAYER REAL ───────────────── */

$("#extassisnetwork").lunaradio({

    streamurl: "https://stream.zeno.fm/g0gymeeh6tsuv",

    radioname: "MELÓMANO RADIO",

    coverimage: "https://raw.githubusercontent.com/conectadosturadio/MELOMANOFOTOPERFIL/main/Gemini_Generated_Image_i56heri56heri56h.png",

    onlycoverimage: false,

    userinterface: "small",

    backgroundcolor: "transparent",

    fontcolor: "#ffffff",

    hightlightcolor: "#39ff14",

    fontname: "Be Vietnam",

    googlefont: "Be Vietnam",

    fontratio: "0.4",

    scroll: "true",

    coverstyle: "animated",

    usevisualizer: "real",

    visualizertype: "6",

    streamtype: "shoutcast2",

    shoutcastpath: "/stream",

    shoutcastid: "1",

    metadatainterval: "5000",

    volume: "100",

    usestreamcorsproxy: "true",

    autoplay:"true"

});

/* ───────────────── AUTOPLAY ───────────────── */

setInterval(() => {

    let playBtn = document.querySelector(".fa-play");

    if(playBtn){

        playBtn.click();

    }

}, 3000);

/* ───────────────── METADATA ───────────────── */

setInterval(()=>{

    let text = document.body.innerText;

    if(text.includes("-")){

        let parts = text.split("-");

        document.getElementById("artist-name").innerHTML = parts[0];

        document.getElementById("song-title").innerHTML = parts[1];

    }

},4000);

</script>

</body>
</html>
