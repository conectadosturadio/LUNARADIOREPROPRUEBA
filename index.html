* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body, #root {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

:root {
  --neon-blue: #00f3ff;
  --neon-cyan: #00e5ff;
  --neon-purple: #b24bf3;
  --neon-magenta: #ff006e;
  --neon-green: #39ff14;
  --dark-bg: rgba(10, 10, 20, 0.85);
  --glass-bg: rgba(20, 20, 40, 0.6);
  --text-primary: #ffffff;
  --text-secondary: #a0a0c0;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
  background: linear-gradient(135deg, #0a0a14 0%, #1a0a2e 50%, #0a0a14 100%);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
}

/* Animated Galaxy Background */
.galaxy-bg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
}

.galaxy-bg::before {
  content: '';
  position: absolute;
  width: 200%;
  height: 200%;
  top: -50%;
  left: -50%;
  background:
    radial-gradient(circle at 20% 30%, rgba(178, 75, 243, 0.35) 0%, transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(0, 243, 255, 0.3) 0%, transparent 40%),
    radial-gradient(circle at 40% 80%, rgba(255, 0, 110, 0.25) 0%, transparent 40%),
    radial-gradient(circle at 60% 20%, rgba(57, 255, 20, 0.15) 0%, transparent 40%);
  animation: rotateGalaxy 60s linear infinite;
}

.galaxy-bg::after {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-image:
    radial-gradient(2px 2px at 20% 30%, white, transparent),
    radial-gradient(1px 1px at 60% 70%, white, transparent),
    radial-gradient(1px 1px at 50% 50%, white, transparent),
    radial-gradient(2px 2px at 80% 10%, white, transparent),
    radial-gradient(1px 1px at 90% 60%, white, transparent),
    radial-gradient(1px 1px at 30% 80%, white, transparent),
    radial-gradient(2px 2px at 10% 90%, white, transparent);
  background-size: 300px 300px;
  animation: twinkle 8s infinite;
}

@keyframes rotateGalaxy {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

@keyframes twinkle {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 0.8; }
}

/* Floating Particles */
.particles {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
  pointer-events: none;
}

.particle {
  position: absolute;
  background: var(--neon-cyan);
  border-radius: 50%;
  box-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan);
  animation: float 15s infinite ease-in-out;
  opacity: 0;
}

.particle:nth-child(3n) {
  background: var(--neon-purple);
  box-shadow: 0 0 10px var(--neon-purple), 0 0 20px var(--neon-purple);
}

.particle:nth-child(5n) {
  background: var(--neon-magenta);
  box-shadow: 0 0 10px var(--neon-magenta), 0 0 20px var(--neon-magenta);
}

@keyframes float {
  0% { transform: translateY(100vh) translateX(0); opacity: 0; }
  10% { opacity: 0.8; }
  90% { opacity: 0.8; }
  100% { transform: translateY(-10vh) translateX(100px); opacity: 0; }
}

/* Smartphone Container */
.smartphone {
  position: relative;
  width: 375px;
  max-width: 95vw;
  height: 812px;
  max-height: 95vh;
  background: linear-gradient(145deg, #1a1a2e, #0f0f1a);
  border-radius: 45px;
  box-shadow:
    0 50px 100px rgba(0, 0, 0, 0.8),
    0 0 0 2px rgba(178, 75, 243, 0.4),
    0 0 60px rgba(0, 243, 255, 0.2),
    inset 0 0 0 1px rgba(255, 255, 255, 0.1);
  z-index: 10;
  overflow: hidden;
}

.smartphone::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, transparent 50%, rgba(255,255,255,0.03) 100%);
  pointer-events: none;
  border-radius: 45px;
  z-index: 1;
}

/* Side Buttons */
.smartphone::after {
  content: '';
  position: absolute;
  right: -3px;
  top: 180px;
  width: 3px;
  height: 80px;
  background: linear-gradient(180deg, #2a2a3e, #0f0f1a);
  border-radius: 0 3px 3px 0;
}

/* Dynamic Island */
.dynamic-island {
  position: absolute;
  top: 15px;
  left: 50%;
  transform: translateX(-50%);
  width: 120px;
  height: 35px;
  background: #000;
  border-radius: 20px;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 10px rgba(0,0,0,0.8), inset 0 0 0 1px rgba(255,255,255,0.05);
}

.camera-dot {
  width: 12px;
  height: 12px;
  background: radial-gradient(circle at 30% 30%, #4a4a6a, #1a1a2e);
  border-radius: 50%;
  box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.8), 0 0 4px rgba(0, 243, 255, 0.3);
}

/* Phone Screen */
.screen {
  position: absolute;
  top: 8px;
  left: 8px;
  right: 8px;
  bottom: 8px;
  background: var(--dark-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 38px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* Status Bar */
.status-bar {
  padding: 55px 30px 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
  flex-shrink: 0;
}

/* LIVE Badge */
.live-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  background: rgba(255, 0, 110, 0.15);
  border: 1px solid var(--neon-magenta);
  border-radius: 20px;
  font-size: 11px;
  font-weight: 700;
  color: var(--neon-magenta);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  box-shadow: 0 0 20px rgba(255, 0, 110, 0.4), inset 0 0 10px rgba(255, 0, 110, 0.2);
}

.live-dot {
  width: 8px;
  height: 8px;
  background: var(--neon-magenta);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--neon-magenta);
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(1.3); }
}

/* Player Container */
.player-container {
  flex: 1;
  padding: 10px 25px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  overflow-y: auto;
  overflow-x: hidden;
}

/* Cover Art */
.cover-wrapper {
  position: relative;
  width: 240px;
  height: 240px;
  margin: 0 auto;
  flex-shrink: 0;
}

.cover-glow {
  position: absolute;
  top: -15px;
  left: -15px;
  right: -15px;
  bottom: -15px;
  background: conic-gradient(from 0deg, var(--neon-blue), var(--neon-purple), var(--neon-magenta), var(--neon-cyan), var(--neon-blue));
  border-radius: 50%;
  animation: rotateGlow 6s linear infinite;
  opacity: 0.7;
  filter: blur(25px);
}

@keyframes rotateGlow {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.cover-art {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  box-shadow:
    0 20px 60px rgba(0, 0, 0, 0.6),
    inset 0 0 0 3px rgba(255, 255, 255, 0.1),
    0 0 40px rgba(0, 243, 255, 0.3);
  animation: floatCover 6s ease-in-out infinite;
}

.cover-art.spinning {
  animation: spinCover 20s linear infinite;
}

@keyframes floatCover {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

@keyframes spinCover {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.cover-art img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* Track Info */
.track-info {
  text-align: center;
}

.radio-name {
  font-size: 22px;
  font-weight: 800;
  color: var(--text-primary);
  margin-bottom: 8px;
  text-shadow: 0 0 20px rgba(0, 243, 255, 0.6);
  letter-spacing: 2px;
  background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple), var(--neon-magenta));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.song-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--neon-cyan);
  margin-bottom: 4px;
  min-height: 22px;
  text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
}

.artist-name {
  font-size: 13px;
  color: var(--text-secondary);
  min-height: 18px;
  font-weight: 500;
}

/* Audio Visualizer */
.visualizer {
  display: flex;
  justify-content: center;
  align-items: flex-end;
  gap: 2px;
  height: 60px;
  padding: 0 10px;
}

.viz-bar {
  flex: 1;
  max-width: 6px;
  background: linear-gradient(to top, var(--neon-blue), var(--neon-purple), var(--neon-magenta));
  border-radius: 3px;
  box-shadow: 0 0 8px var(--neon-blue), 0 0 12px rgba(178, 75, 243, 0.5);
  transition: height 0.1s ease-out;
}

/* Controls */
.controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 25px;
  margin-top: 5px;
}

.control-btn {
  width: 50px;
  height: 50px;
  border: none;
  background: var(--glass-bg);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.3s ease;
  border: 1px solid rgba(0, 243, 255, 0.2);
  color: var(--text-primary);
}

.control-btn:hover {
  background: rgba(0, 243, 255, 0.1);
  border-color: var(--neon-cyan);
  box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
  transform: scale(1.08);
}

.control-btn:active {
  transform: scale(0.95);
}

.play-btn {
  width: 70px;
  height: 70px;
  background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
  border: 2px solid rgba(255, 255, 255, 0.25);
  box-shadow: 0 10px 40px rgba(0, 243, 255, 0.4);
  color: white;
}

.play-btn:hover {
  box-shadow: 0 10px 50px rgba(0, 243, 255, 0.6);
  transform: scale(1.1);
}

.play-btn.playing {
  background: linear-gradient(135deg, var(--neon-purple), var(--neon-magenta));
  animation: breathe 2s ease-in-out infinite;
}

@keyframes breathe {
  0%, 100% { box-shadow: 0 10px 40px rgba(178, 75, 243, 0.4); }
  50% { box-shadow: 0 10px 60px rgba(255, 0, 110, 0.6), 0 0 30px rgba(255, 0, 110, 0.3); }
}

/* Volume Control */
.volume-control {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 10px;
}

.volume-icon {
  color: var(--neon-cyan);
  filter: drop-shadow(0 0 5px var(--neon-cyan));
  flex-shrink: 0;
}

.volume-value {
  color: var(--text-secondary);
  font-size: 11px;
  min-width: 28px;
  text-align: right;
}

.volume-slider {
  flex: 1;
  height: 6px;
  background: rgba(255, 255, 255, 0.08);
  border-radius: 3px;
  position: relative;
  cursor: pointer;
  border: 1px solid rgba(0, 243, 255, 0.1);
}

.volume-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple));
  border-radius: 3px;
  box-shadow: 0 0 10px var(--neon-blue);
  transition: width 0.1s ease;
}

.volume-thumb {
  position: absolute;
  top: 50%;
  width: 14px;
  height: 14px;
  background: var(--neon-cyan);
  border-radius: 50%;
  box-shadow: 0 0 12px var(--neon-cyan), 0 0 4px white;
  transform: translate(-50%, -50%);
  transition: left 0.1s ease;
}

/* Equalizer Section */
.equalizer {
  background: var(--glass-bg);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-radius: 15px;
  padding: 15px;
  border: 1px solid rgba(0, 243, 255, 0.2);
  box-shadow: inset 0 0 20px rgba(0, 243, 255, 0.05);
}

.eq-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--neon-cyan);
  margin-bottom: 12px;
  text-transform: uppercase;
  letter-spacing: 2px;
  display: flex;
  align-items: center;
  gap: 8px;
  text-shadow: 0 0 8px rgba(0, 243, 255, 0.5);
}

.eq-icon {
  font-size: 14px;
}

.eq-bars {
  display: flex;
  justify-content: space-around;
  align-items: flex-end;
  height: 40px;
  gap: 6px;
}

.eq-bar {
  flex: 1;
  background: linear-gradient(to top, var(--neon-blue), var(--neon-magenta));
  border-radius: 2px;
  box-shadow: 0 0 8px rgba(0, 243, 255, 0.5);
  transition: height 0.15s ease-out;
}

/* Extra Controls */
.extra-controls {
  display: flex;
  justify-content: space-around;
  padding: 5px 10px;
}

.extra-btn {
  width: 42px;
  height: 42px;
  border: none;
  background: var(--glass-bg);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.3s ease;
  border: 1px solid rgba(178, 75, 243, 0.2);
  color: var(--text-primary);
}

.extra-btn:hover {
  background: rgba(178, 75, 243, 0.1);
  border-color: var(--neon-purple);
  box-shadow: 0 0 15px rgba(178, 75, 243, 0.3);
  color: var(--neon-purple);
}

.extra-btn:active {
  transform: scale(0.9);
}

/* Progress Section */
.progress-section {
  padding: 0 5px;
}

.progress-bar {
  position: relative;
  height: 30px;
  background: rgba(0, 0, 0, 0.3);
  border-radius: 15px;
  overflow: hidden;
  border: 1px solid rgba(0, 243, 255, 0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 2px;
  padding: 0 5px;
}

.progress-glow {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(0, 243, 255, 0.1), transparent);
  animation: progressGlow 3s infinite;
}

@keyframes progressGlow {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}

.progress-wave {
  display: flex;
  align-items: center;
  gap: 1px;
  height: 100%;
  z-index: 2;
}

.wave-segment {
  width: 2px;
  background: linear-gradient(to top, var(--neon-blue), var(--neon-cyan));
  border-radius: 1px;
  box-shadow: 0 0 4px var(--neon-cyan);
  animation: waveAnim 1.5s ease-in-out infinite;
}

@keyframes waveAnim {
  0%, 100% { opacity: 0.4; transform: scaleY(0.6); }
  50% { opacity: 1; transform: scaleY(1); }
}

.progress-label {
  display: flex;
  justify-content: space-between;
  margin-top: 5px;
  font-size: 10px;
  color: var(--text-secondary);
  font-weight: 600;
  letter-spacing: 1px;
  padding: 0 5px;
}

.progress-label span:first-child {
  color: var(--neon-magenta);
  text-shadow: 0 0 5px var(--neon-magenta);
}

/* Footer */
.footer {
  text-align: center;
  padding: 12px;
  font-size: 10px;
  color: var(--text-secondary);
  border-top: 1px solid rgba(255, 255, 255, 0.05);
  flex-shrink: 0;
  background: rgba(0, 0, 0, 0.3);
  letter-spacing: 1px;
}

.footer span {
  color: var(--neon-cyan);
  font-weight: 700;
  text-shadow: 0 0 5px var(--neon-cyan);
}

/* Scrollbar */
.player-container::-webkit-scrollbar {
  width: 4px;
}

.player-container::-webkit-scrollbar-track {
  background: transparent;
}

.player-container::-webkit-scrollbar-thumb {
  background: var(--neon-blue);
  border-radius: 2px;
  box-shadow: 0 0 5px var(--neon-blue);
}

/* Responsive */
@media (max-height: 850px) {
  .cover-wrapper {
    width: 200px;
    height: 200px;
  }
  
  .player-container {
    gap: 14px;
  }
}

@media (max-width: 400px) {
  .smartphone {
    width: 100vw;
    height: 100vh;
    max-width: 100vw;
    max-height: 100vh;
    border-radius: 0;
  }
  
  .screen {
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    border-radius: 0;
  }

  .cover-wrapper {
    width: 220px;
    height: 220px;
  }
}
